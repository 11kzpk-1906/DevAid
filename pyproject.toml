[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "devaid"
version = "0.2.0"
description = "An open-source developer toolkit."
requires-python = ">=3.11"
dependencies = [
    "typer>=0.15.0",
    "rich>=13.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
    "mypy>=1.0"
]

[project.scripts]
devaid = "devaid.main:app"

[tool.hatch.build.targets.wheel]
packages = ["apps/cli/src/devaid"]

[tool.pytest.ini_options]
testpaths = ["apps/cli/tests", "tests"]
pythonpath = [".", "apps/cli/src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true

name: Build Cross-Platform Binaries

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            binary: devaid.exe
            archive: devaid-windows-x64.zip

          - platform: linux-x64
            os: ubuntu-latest
            binary: devaid
            archive: devaid-linux-x64.zip

          - platform: macos-arm64
            os: macos-latest
            binary: devaid
            archive: devaid-macos-arm64.zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install project dependencies
        run: uv sync --extra dev

      - name: Build standalone executable (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          uv run --with pyinstaller pyinstaller ^
            --clean ^
            --noconfirm ^
            --onefile ^
            --name devaid ^
            --paths apps/cli/src ^
            --collect-submodules devaid ^
            --copy-metadata devaid ^
            apps/cli/src/devaid/main.py

      - name: Build standalone executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          uv run --with pyinstaller pyinstaller \\
            --clean \\
            --noconfirm \\
            --onefile \\
            --name devaid \\
            --paths apps/cli/src \\
            --collect-submodules devaid \\
            --copy-metadata devaid \\
            apps/cli/src/devaid/main.py

      - name: Test executable
        shell: pwsh
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          $Executable = Join-Path "dist" $env:BINARY

          if (-not (Test-Path $Executable)) {
            throw "Executable not found: $Executable"
          }

          & $Executable --help
          if ($LASTEXITCODE -ne 0) {
            throw "DevAid help test failed."
          }

          & $Executable version
          if ($LASTEXITCODE -ne 0) {
            throw "DevAid version test failed."
          }

      - name: Create ZIP archive
        shell: pwsh
        env:
          BINARY: ${{ matrix.binary }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          $Executable = Join-Path "dist" $env:BINARY

          if (-not (Test-Path $Executable)) {
            throw "Cannot create archive: executable missing."
          }

          Compress-Archive -Path $Executable -DestinationPath $env:ARCHIVE -Force

      - name: Verify ZIP archive
        shell: pwsh
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          if (-not (Test-Path $env:ARCHIVE)) {
            throw "ZIP archive was not created."
          }

          $Zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path $env:ARCHIVE))
          try {
            if ($Zip.Entries.Count -eq 0) {
              throw "ZIP archive is empty."
            }
          }
          finally {
            $Zip.Dispose()
          }

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all platform archives
        uses: actions/download-artifact@v7
        with:
          pattern: devaid-*.zip
          path: dist
          merge-multiple: true

      - name: Verify all expected release assets exist
        shell: bash
        run: |
          set -euo pipefail
          expected=(
            devaid-windows-x64.zip
            devaid-linux-x64.zip
            devaid-macos-arm64.zip
          )

          for asset in "${expected[@]}"; do
            if [[ ! -s "dist/$asset" ]]; then
              echo "::error::Required release asset is missing or empty: $asset"
              exit 1
            fi
          done

      - name: Create GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \\
            dist/devaid-windows-x64.zip \\
            dist/devaid-linux-x64.zip \\
            dist/devaid-macos-arm64.zip \\
            --verify-tag \\
            --generate-notes

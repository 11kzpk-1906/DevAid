name: Build Cross-Platform Binaries

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            binary: devaid.exe
            archive: devaid-windows-x64.zip

          - platform: linux-x64
            os: ubuntu-latest
            binary: devaid
            archive: devaid-linux-x64.zip

          - platform: macos
            os: macos-latest
            binary: devaid
            archive: devaid-macos.zip

    runs-on: ${{ matrix.os }}

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 3. Install uv
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # 4. Install project dependencies
      - name: Install dependencies
        run: uv sync --extra dev

      # 5. Build standalone executable
      - name: Build executable
        run: |
          uv run --with pyinstaller pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --name devaid \
            --paths apps/cli/src \
            --collect-submodules devaid \
            apps/cli/src/devaid/main.py

      # 6. Test executable
      - name: Test executable
        shell: bash
        run: |
          set -e

          echo "Testing DevAid executable..."

          ./dist/${{ matrix.binary }} --help
          ./dist/${{ matrix.binary }} version

          echo "DevAid executable passed smoke tests."

      # 7. Create ZIP archive
      - name: Create ZIP archive
        env:
          BINARY: ${{ matrix.binary }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          python -c "import os, zipfile; binary=os.environ['BINARY']; archive=os.environ['ARCHIVE']; z=zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED); z.write(os.path.join('dist', binary), arcname=binary); z.close()"

      # 8. Upload ZIP artifact
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14
name: Build Cross-Platform Binaries

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            python: "3.12"
            binary: devaid.exe
            archive: devaid-windows-x64.zip

          - platform: linux-x64
            os: ubuntu-latest
            python: "3.12"
            binary: devaid
            archive: devaid-linux-x64.zip

          - platform: macos-arm64
            os: macos-latest
            python: "3.12"
            binary: devaid
            archive: devaid-macos-arm64.zip

          - platform: macos-x64
            os: macos-15-intel
            python: "3.12"
            binary: devaid
            archive: devaid-macos-x64.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install project dependencies
        run: uv sync --extra dev

      - name: Install PyInstaller
        run: uv pip install --python .venv/bin/python pyinstaller
        if: runner.os != 'Windows'

      - name: Install PyInstaller on Windows
        if: runner.os == 'Windows'
        run: uv pip install --python .venv/Scripts/python.exe pyinstaller

      - name: Build executable
        shell: bash
        run: |
          uv run pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --name devaid \
            --collect-submodules devaid \
            apps/cli/src/devaid/main.py

      - name: Test executable
        shell: bash
        run: |
          ./dist/${{ matrix.binary }} --help
          ./dist/${{ matrix.binary }} --version

      - name: Prepare ZIP archive
        shell: bash
        run: |
          mkdir -p release
          cp "dist/${{ matrix.binary }}" "release/${{ matrix.binary }}"
          cd release
          7z a "../${{ matrix.archive }}" "${{ matrix.binary }}" || \
            python -c "import shutil; shutil.make_archive('../${{ matrix.archive }}', 'zip', '.')"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14
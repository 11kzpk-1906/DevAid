name: Build Cross-Platform Binaries

on:
  workflow_dispatch:

  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.platform }}

    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            os: windows-latest
            binary: devaid.exe
            archive: devaid-windows-x64.zip

          - platform: linux-x64
            os: ubuntu-latest
            binary: devaid
            archive: devaid-linux-x64.zip

          - platform: macos-arm64
            os: macos-latest
            binary: devaid
            archive: devaid-macos-arm64.zip

    steps:
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # uv
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      # Dependencies
      - name: Install project dependencies
        run: uv sync --extra dev

      # Build
      - name: Build standalone executable
        run: |
          uv run --with pyinstaller pyinstaller ^
            --clean ^
            --noconfirm ^
            --onefile ^
            --name devaid ^
            --paths apps/cli/src ^
            --collect-submodules devaid ^
            --copy-metadata devaid ^
            apps/cli/src/devaid/main.py
        shell: cmd
        if: runner.os == 'Windows'

      - name: Build standalone executable (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          uv run --with pyinstaller pyinstaller \
            --clean \
            --noconfirm \
            --onefile \
            --name devaid \
            --paths apps/cli/src \
            --collect-submodules devaid \
            --copy-metadata devaid \
            apps/cli/src/devaid/main.py

      # Verify executable
      - name: Test executable
        shell: pwsh
        env:
          BINARY: ${{ matrix.binary }}
        run: |
          $Executable = Join-Path "dist" $env:BINARY

          if (-not (Test-Path $Executable)) {
            throw "Executable not found: $Executable"
          }

          Write-Host "Testing DevAid executable..."

          & $Executable --help

          if ($LASTEXITCODE -ne 0) {
            throw "DevAid help test failed."
          }

          & $Executable version

          if ($LASTEXITCODE -ne 0) {
            throw "DevAid version test failed."
          }

          Write-Host "DevAid executable tests passed."

      # Create ZIP
      - name: Create ZIP archive
        shell: pwsh
        env:
          BINARY: ${{ matrix.binary }}
          ARCHIVE: ${{ matrix.archive }}
        run: |
          $Executable = Join-Path "dist" $env:BINARY

          if (-not (Test-Path $Executable)) {
            throw "Cannot create archive: executable missing."
          }

          Compress-Archive `
            -Path $Executable `
            -DestinationPath $env:ARCHIVE `
            -Force

          Write-Host "Created $env:ARCHIVE"

      # Verify ZIP
      - name: Verify ZIP archive
        shell: pwsh
        env:
          ARCHIVE: ${{ matrix.archive }}
        run: |
          if (-not (Test-Path $env:ARCHIVE)) {
            throw "ZIP archive was not created."
          }

          $Zip = [System.IO.Compression.ZipFile]::OpenRead(
            (Resolve-Path $env:ARCHIVE)
          )

          try {
            if ($Zip.Entries.Count -eq 0) {
              throw "ZIP archive is empty."
            }

            Write-Host "ZIP archive verified."
            Write-Host "Files: $($Zip.Entries.Count)"
          }
          finally {
            $Zip.Dispose()
          }

      # Upload
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 14